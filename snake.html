```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
            font-family: Arial, sans-serif;
            color: white;
        }

        .game-container {
            text-align: center;
        }

        h1 {
            margin-bottom: 15px;
            color: #22c55e;
            font-size: 36px;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            width: 400px;
            max-width: 90vw;
            margin: 0 auto 15px;
            font-size: 18px;
            font-weight: bold;
        }

        canvas {
            display: block;
            background: #1f2937;
            border: 4px solid #22c55e;
            border-radius: 8px;
            max-width: 90vw;
            height: auto;
        }

        .controls {
            margin-top: 20px;
            color: #d1d5db;
            font-size: 15px;
        }

        button {
            margin-top: 15px;
            padding: 10px 25px;
            border: none;
            border-radius: 6px;
            background: #22c55e;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #16a34a;
        }

        #gameOver {
            margin-top: 15px;
            color: #ef4444;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="game-container">

        <h1>🐍 Snake Game</h1>

        <div class="score-board">
            <span>Score: <span id="score">0</span></span>
            <span>High Score: <span id="highScore">0</span></span>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div id="gameOver"></div>

        <button id="restartBtn">Restart Game</button>

        <div class="controls">
            Use <strong>Arrow Keys</strong> or <strong>W A S D</strong> to move
        </div>

    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("highScore");
        const gameOverElement = document.getElementById("gameOver");
        const restartBtn = document.getElementById("restartBtn");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake;
        let food;
        let direction;
        let nextDirection;
        let score;
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        let gameRunning;
        let gameSpeed = 120;
        let gameLoop;

        highScoreElement.textContent = highScore;

        function startGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];

            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };

            score = 0;
            gameSpeed = 120;
            gameRunning = true;

            scoreElement.textContent = score;
            gameOverElement.textContent = "";

            generateFood();

            clearInterval(gameLoop);
            gameLoop = setInterval(updateGame, gameSpeed);

            drawGame();
        }

        function updateGame() {
            direction = nextDirection;

            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            // Check wall collision
            if (
                head.x < 0 ||
                head.x >= tileCount ||
                head.y < 0 ||
                head.y >= tileCount
            ) {
                endGame();
                return;
            }

            // Check snake body collision
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreElement.textContent = score;

                if (score > highScore) {
                    highScore = score;
                    highScoreElement.textContent = highScore;
                    localStorage.setItem("snakeHighScore", highScore);
                }

                // Increase speed
                if (gameSpeed > 50) {
                    gameSpeed -= 3;

                    clearInterval(gameLoop);
                    gameLoop = setInterval(updateGame, gameSpeed);
                }

                generateFood();
            } else {
                snake.pop();
            }

            drawGame();
        }

        function drawGame() {
            // Background
            ctx.fillStyle = "#1f2937";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid
            drawGrid();

            // Draw snake
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? "#4ade80" : "#22c55e";

                ctx.fillRect(
                    segment.x * gridSize + 1,
                    segment.y * gridSize + 1,
                    gridSize - 2,
                    gridSize - 2
                );
            });

            // Draw eyes
            drawSnakeEyes();

            // Draw food
            ctx.fillStyle = "#ef4444";

            ctx.beginPath();

            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 2,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        function drawGrid() {
            ctx.strokeStyle = "#374151";
            ctx.lineWidth = 1;

            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
        }

        function drawSnakeEyes() {
            const head = snake[0];

            ctx.fillStyle = "white";

            let eye1;
            let eye2;

            if (direction.x === 1) {
                eye1 = { x: 14, y: 5 };
                eye2 = { x: 14, y: 13 };
            } else if (direction.x === -1) {
                eye1 = { x: 5, y: 5 };
                eye2 = { x: 5, y: 13 };
            } else if (direction.y === -1) {
                eye1 = { x: 5, y: 5 };
                eye2 = { x: 13, y: 5 };
            } else {
                eye1 = { x: 5, y: 14 };
                eye2 = { x: 13, y: 14 };
            }

            ctx.beginPath();
            ctx.arc(
                head.x * gridSize + eye1.x,
                head.y * gridSize + eye1.y,
                2,
                0,
                Math.PI * 2
            );
            ctx.fill();

            ctx.beginPath();
            ctx.arc(
                head.x * gridSize + eye2.x,
                head.y * gridSize + eye2.y,
                2,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }

        function generateFood() {
            let newFood;

            do {
                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (
                snake.some(
                    segment =>
                        segment.x === newFood.x &&
                        segment.y === newFood.y
                )
            );

            food = newFood;
        }

        function endGame() {
            gameRunning = false;

            clearInterval(gameLoop);

            gameOverElement.textContent =
                "Game Over! Your Score: " + score;
        }

        function changeDirection(newDirection) {
            if (!gameRunning) return;

            // Prevent reversing direction
            if (
                newDirection.x === -direction.x &&
                newDirection.y === -direction.y
            ) {
                return;
            }

            nextDirection = newDirection;
        }

        document.addEventListener("keydown", function (event) {
            const key = event.key.toLowerCase();

            if (
                ["arrowup", "arrowdown", "arrowleft", "arrowright", "w", "a", "s", "d"].includes(key)
            ) {
                event.preventDefault();
            }

            if (key === "arrowup" || key === "w") {
                changeDirection({ x: 0, y: -1 });
            }

            if (key === "arrowdown" || key === "s") {
                changeDirection({ x: 0, y: 1 });
            }

            if (key === "arrowleft" || key === "a") {
                changeDirection({ x: -1, y: 0 });
            }

            if (key === "arrowright" || key === "d") {
                changeDirection({ x: 1, y: 0 });
            }

            if (key === "enter" && !gameRunning) {
                startGame();
            }
        });

        restartBtn.addEventListener("click", startGame);

        // Start game
        startGame();
    </script>

</body>
</html>
